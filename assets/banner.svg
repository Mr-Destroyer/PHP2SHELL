<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PHP2SHELL — behavioural detection and exploit chain for CVE-2026-109618 / CVE-2026-109619">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="55%" stop-color="#0e1219"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .word { font-size: 62px; font-weight: 800; letter-spacing: 6px; fill: #f4f6fb; }
      .sub  { font-size: 19px; fill: #9aa7bd; letter-spacing: 0.4px; }
      .tag  { font-size: 14px; fill: #6f7d95; letter-spacing: 2.6px; }
      .term { font-size: 15px; }
      .dim  { fill: #5f6b80; }
      .ok   { fill: #3ddc97; }
      .bad  { fill: #ff5d5d; }
      .warn { fill: #ffc45c; }
      .lbl  { fill: #8894a8; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)" rx="4"/>
  <rect x="0" y="0" width="420" height="320" fill="url(#fade)" opacity="0.5"/>

  <!-- left: wordmark -->
  <text class="mono tag" x="56" y="72">CVE-2026-109618 · CVE-2026-109619</text>

  <g filter="url(#glow)">
    <text class="mono word" x="54" y="150">PHP2<tspan fill="url(#accent)">SHELL</tspan></text>
  </g>

  <text class="sans sub" x="56" y="192">Behavioural detection and exploit-chain harness for PHP multipart OOM.</text>
  <text class="sans sub" x="56" y="220" fill="#7d8aa0">Zero dependencies · Python 3.9+ · stdlib only · 78 tests</text>

  <!-- stage pills -->
  <g class="mono" font-size="13">
    <rect x="56" y="248" width="86" height="28" rx="14" fill="#13241c" stroke="#3ddc97" stroke-opacity="0.45"/>
    <text x="74" y="267" class="ok">stage 0</text>
    <rect x="152" y="248" width="86" height="28" rx="14" fill="#13241c" stroke="#3ddc97" stroke-opacity="0.45"/>
    <text x="170" y="267" class="ok">stage 1</text>
    <rect x="248" y="248" width="86" height="28" rx="14" fill="#13241c" stroke="#3ddc97" stroke-opacity="0.45"/>
    <text x="266" y="267" class="ok">stage 2</text>
    <rect x="344" y="248" width="86" height="28" rx="14" fill="#2a1518" stroke="#ff5d5d" stroke-opacity="0.5"/>
    <text x="362" y="267" class="bad">stage 3</text>
  </g>

  <!-- right: terminal card -->
  <g>
    <rect x="628" y="46" width="524" height="228" rx="12" fill="#080b11" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="628" y="46" width="524" height="34" rx="12" fill="#0f141d"/>
    <rect x="628" y="68" width="524" height="12" fill="#0f141d"/>
    <circle cx="652" cy="63" r="5" fill="#ff5f57"/>
    <circle cx="670" cy="63" r="5" fill="#febc2e"/>
    <circle cx="688" cy="63" r="5" fill="#28c840"/>
    <text class="mono" x="716" y="68" font-size="12" fill="#5f6b80">scan -u https://target.example</text>

    <g class="mono term">
      <text x="652" y="112" class="dim">$ ./scanner/scan -u https://target.example</text>
      <text x="652" y="146" class="bad">  VULNERABLE</text>
      <text x="806" y="146" class="lbl">https://target.example</text>
      <text x="652" y="172" class="lbl">  confidence :</text><text x="806" y="172" class="ok">HIGH</text>
      <text x="652" y="196" class="lbl">  version    :</text><text x="806" y="196" fill="#c3cbd9">PHP 8.4.26 (fixed in 8.4.27)</text>
      <text x="652" y="220" class="lbl">  signal     :</text><text x="806" y="220" fill="#c3cbd9">in-band PHP fatal</text>
      <text x="652" y="244" class="lbl">  sent       :</text><text x="806" y="244" class="warn">1,048,617 bytes</text>
    </g>
    <rect x="628" y="46" width="524" height="228" rx="12" fill="none" stroke="url(#accent)" stroke-opacity="0.25"/>
  </g>
</svg>
